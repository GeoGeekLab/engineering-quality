name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve release source
        id: release
        run: |
          set -euo pipefail

          version="$(cat VERSION)"
          tag="v${version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ${version}"
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            expected_branch="release/${tag}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_branch}" ]]; then
              echo "::error::Release branch must be ${expected_branch}"
              exit 1
            fi

            git fetch --no-tags origin main
            main_sha="$(git rev-parse origin/main)"
            if [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
              echo "::error::Release branch must point exactly at current main (${main_sha})"
              exit 1
            fi
          else
            echo "::error::Unsupported release ref type: ${GITHUB_REF_TYPE}"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Verify release and repository
        run: python scripts/release_check.py --tag "${{ steps.release.outputs.tag }}"

      - name: Run full checks
        run: make check

      - name: Build deterministic distribution
        run: make package

      - name: Verify package checksum
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Generate release notes
        run: python scripts/release_notes.py --output dist/RELEASE_NOTES.md

      - name: Stage release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Create release tag from protected main
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Existing tag ${RELEASE_TAG} points to ${existing}, expected ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to the release commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          fi

      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: dist

      - name: Verify package checksum
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/engineering-quality-*.zip
            dist/engineering-quality-*.zip.sha256

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/engineering-quality-*.zip --repo "${GITHUB_REPOSITORY}"

      - name: Publish or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
        run: |
          set -euo pipefail

          title="${RELEASE_TAG} — Engineering Quality"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}"               --title "${title}"               --notes-file dist/RELEASE_NOTES.md

            gh release upload "${RELEASE_TAG}"               dist/engineering-quality-*.zip               dist/engineering-quality-*.zip.sha256               --clobber
          else
            gh release create "${RELEASE_TAG}"               dist/engineering-quality-*.zip               dist/engineering-quality-*.zip.sha256               --title "${title}"               --notes-file dist/RELEASE_NOTES.md
          fi
