name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag and repository
        run: python scripts/release_check.py --tag "${GITHUB_REF_NAME}"

      - name: Run full checks
        run: make check

      - name: Build deterministic distribution
        run: make package

      - name: Verify package checksum
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Generate release notes
        run: python scripts/release_notes.py --output dist/RELEASE_NOTES.md

      - name: Publish or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          title="${GITHUB_REF_NAME} — Engineering Quality"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${title}" \
              --notes-file dist/RELEASE_NOTES.md

            gh release upload "${GITHUB_REF_NAME}" \
              dist/engineering-quality-*.zip \
              dist/engineering-quality-*.zip.sha256 \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/engineering-quality-*.zip \
              dist/engineering-quality-*.zip.sha256 \
              --verify-tag \
              --title "${title}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
