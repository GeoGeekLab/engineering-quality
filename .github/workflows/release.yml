name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag and repository
        run: python scripts/release_check.py --tag "${GITHUB_REF_NAME}"

      - name: Run full checks
        run: make check

      - name: Build deterministic distribution
        run: make package

      - name: Verify package checksum
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Generate release notes
        run: python scripts/release_notes.py --output dist/RELEASE_NOTES.md

      - name: Stage release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: dist

      - name: Verify package checksum
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/engineering-quality-*.zip
            dist/engineering-quality-*.zip.sha256

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/engineering-quality-*.zip --repo "${GITHUB_REPOSITORY}"

      - name: Publish or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          title="${GITHUB_REF_NAME} — Engineering Quality"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${title}" \
              --notes-file dist/RELEASE_NOTES.md

            gh release upload "${GITHUB_REF_NAME}" \
              dist/engineering-quality-*.zip \
              dist/engineering-quality-*.zip.sha256 \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/engineering-quality-*.zip \
              dist/engineering-quality-*.zip.sha256 \
              --verify-tag \
              --title "${title}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
