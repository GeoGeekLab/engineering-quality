name: Repair historical releases

on:
  push:
    branches:
      - "fix/release-trust-chain"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.1.0 source
        uses: actions/checkout@v7
        with:
          ref: v1.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify immutable source tag
        run: python scripts/release_check.py --tag v1.1.0

      - name: Build v1.1.0 distribution
        run: make package

      - name: Verify v1.1.0 checksum
        run: cd dist && sha256sum -c *.zip.sha256

      - name: Generate canonical release notes
        run: |
          python scripts/release_notes.py --version 1.1.0 --output dist/RELEASE_NOTES-1.1.0.md
          python scripts/release_notes.py --version 1.0.0 --output dist/RELEASE_NOTES-1.0.0.md

      - name: Repair published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release edit v1.1.0 --notes-file dist/RELEASE_NOTES-1.1.0.md
          gh release upload v1.1.0 \
            dist/engineering-quality-1.1.0.zip \
            dist/engineering-quality-1.1.0.zip.sha256 \
            --clobber

          gh release edit v1.0.0 --notes-file dist/RELEASE_NOTES-1.0.0.md
